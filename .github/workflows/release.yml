name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semántica sin v (ej. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX CLI
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish + MSI
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          & .\desktop\tools\publish.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperDesktop-Setup
          path: desktop/dist/WhisperDesktop-Setup.msi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $msi = "desktop/dist/WhisperDesktop-Setup.msi"
          $notes = @"
          ## Whisper Desktop $tag

          ### Descarga para Windows
          - **WhisperDesktop-Setup.msi** — instalador (Windows 10/11 x64)

          1. Descargá el MSI
          2. Ejecutalo e instalá
          3. Abrí **Whisper Desktop** desde el menú Inicio
          4. Arrastrá un audio/video y tocá **Transcribir**

          La primera ejecución descarga el modelo Whisper (~140 MB). Todo corre en tu PC.
          "@

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            git tag $tag 2>$null
            git push origin $tag 2>$null
          }

          gh release create $tag $msi `
            --title "Whisper Desktop $tag" `
            --notes $notes `
            --latest
